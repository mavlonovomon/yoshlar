{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">
                    <div class="d-flex align-items-center mb-4">
                        <div class="bg-warning-subtle p-3 rounded-circle me-3">
                            <i class="bi bi-pencil-square text-warning fs-4"></i>
                        </div>
                        <div>
                            <h3 class="fw-bold text-dark mb-0">Uchrashuvni Tahrirlash</h3>
                            <p class="text-muted mb-0">{{ object.unemployed_youth.yosh.fullname }} bilan suhbat</p>
                        </div>
                    </div>

                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {% for field in form %}
                        <div class="mb-4">
                            <label class="form-label fw-bold">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                            <div class="text-danger small">{{ field.errors }}</div>
                            {% endif %}
                        </div>
                        {% endfor %}

                        <div class="d-flex gap-3 mt-5">
                            <button type="submit" class="btn btn-warning rounded-pill px-5 py-2 fw-bold text-white">Yangilash</button>
                            <a href="{% url 'ishsiz_yoshlar:detail' object.unemployed_youth.pk %}" class="btn btn-light rounded-pill px-5 py-2">Bekor qilish</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
