<div class="{{ col_class|default:'col-xl-3 col-md-6' }}">
    <div class="card border-0 shadow-sm h-100 overflow-hidden stats-card">
        <div class="card-body p-4">
            <div class="d-flex align-items-start justify-content-between">
                <div class="stats-icon {{ icon_bg_class }} {{ icon_text_class }}">
                    <i class="bi {{ icon }}"></i>
                </div>
                {% if side_text %}
                <div class="stats-trend {{ side_text_class|default:'' }}">
                    <i class="bi bi-arrow-up-short"></i>{{ side_text }}
                </div>
                {% endif %}
            </div>
            <div class="stats-content mt-3">
                <h3 class="stats-value mb-1">{{ value }}</h3>
                <p class="stats-label mb-0">{{ label }}</p>
            </div>
        </div>
        {% if progress_percent %}
        <div class="stats-progress">
            <div class="progress-bar {{ progress_class|default:'bg-primary' }}" style="width: {{ progress_percent|default:'100' }}%"></div>
        </div>
        {% endif %}
    </div>
</div>
