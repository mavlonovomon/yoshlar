{% load static %}
<!-- Chat Widget -->
<div id="chatWidget" class="chat-widget">
    <!-- Chat Toggle Button -->
    <button id="chatToggle" class="chat-toggle" onclick="Chat.toggle()">
        <span class="material-symbols-outlined">chat_bubble</span>
        <span id="chatBadge" class="chat-badge" style="display:none;">0</span>
    </button>

    <!-- Chat Panel -->
    <div id="chatPanel" class="chat-panel" style="display:none;">
        <!-- Contacts View -->
        <div id="chatContacts" class="chat-contacts">
            <div class="chat-contacts-header">
                <h6 class="mb-0 fw-bold">Chat</h6>
                <button class="chat-close-btn" onclick="Chat.toggle()">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div class="chat-search">
                <span class="material-symbols-outlined search-icon">search</span>
                <input type="text" id="chatSearchInput" placeholder="Qidirish..." oninput="Chat.filterContacts(this.value)">
            </div>
            <div id="chatContactsList" class="chat-contacts-list">
                <!-- Contacts will be loaded here -->
                <div class="chat-loading">
                    <span class="material-symbols-outlined spinning">progress_activity</span>
                </div>
            </div>
        </div>

        <!-- Chat View -->
        <div id="chatView" class="chat-view" style="display:none;">
            <div class="chat-view-header">
                <button class="chat-back-btn" onclick="Chat.backToContacts()">
                    <span class="material-symbols-outlined">arrow_back</span>
                </button>
                <div class="chat-contact-info">
                    <div class="chat-contact-avatar" id="chatContactAvatar"></div>
                    <div>
                        <div class="chat-contact-name" id="chatContactName"></div>
                        <div class="chat-contact-status" id="chatContactStatus"></div>
                    </div>
                </div>
            </div>
            <div id="chatMessages" class="chat-messages">
                <!-- Messages will be loaded here -->
            </div>
            <div class="chat-input-area">
                <button class="chat-emoji-btn" onclick="Chat.toggleEmoji()">
                    <span class="material-symbols-outlined">mood</span>
                </button>
                <div id="chatEmojiPicker" class="chat-emoji-picker" style="display:none;">
                    <!-- Emojis will be loaded here -->
                </div>
                <textarea id="chatInput" class="chat-input" placeholder="Xabar yozing..." rows="1" 
                    onkeydown="Chat.handleKeydown(event)" oninput="Chat.autoResize(this)"></textarea>
                <button class="chat-send-btn" onclick="Chat.send()">
                    <span class="material-symbols-outlined">send</span>
                </button>
            </div>
        </div>
    </div>
</div>

{% include 'components/chat_scripts.html' %}
