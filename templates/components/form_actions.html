<div class="d-flex gap-2 mt-5 pt-3 border-top">
    {% if show_delete %}
    <button type="button" class="btn btn-danger px-4 py-2 fw-bold shadow-sm"
            onclick="document.getElementById('deleteModal').style.display='flex'">
        <i class="bi bi-trash me-1"></i> O'chirish
    </button>
    {% endif %}
    <div class="ms-auto d-flex gap-2">
        <a href="{{ cancel_url }}" class="btn btn-light px-4 py-2">Bekor qilish</a>
        <button type="submit" class="btn btn-primary px-5 py-2 fw-bold shadow-sm">
            <i class="bi bi-save me-1"></i> Saqlash
        </button>
    </div>
</div>
