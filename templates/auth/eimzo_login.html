<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-IMZO orqali kirish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-card {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .login-header h2 {
            margin: 0;
            font-weight: 700;
            font-size: 28px;
        }

        .login-header p {
            margin: 10px 0 0;
            opacity: 0.9;
        }

        .login-body {
            padding: 40px 30px;
        }

        .eimzo-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .eimzo-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .eimzo-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #f8f9fa;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-box.loading {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status-box.error {
            background: #ffebee;
            color: #c62828;
        }

        .status-box.success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .spinner-border-sm {
            width: 1rem;
            height: 1rem;
            border-width: 0.15em;
        }

        .info-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        .info-box h6 {
            margin: 0 0 10px;
            color: #667eea;
            font-weight: 600;
        }

        .info-box ul {
            margin: 0;
            padding-left: 20px;
        }

        .info-box li {
            margin-bottom: 5px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="login-header">
            <i class="bi bi-shield-lock" style="font-size: 48px;"></i>
            <h2 class="mt-3">E-IMZO orqali kirish</h2>
            <p>Xavfsiz autentifikatsiya tizimi</p>
        </div>
        <div class="login-body">
            <div class="info-box">
                <h6><i class="bi bi-info-circle"></i> Tizimga kirish uchun:</h6>
                <ul>
                    <li>E-IMZO kalitingizni kompyuterga ulang</li>
                    <li>E-IMZO Web Plugin o'rnatilgan bo'lishi kerak</li>
                    <li>"Kirish" tugmasini bosing</li>
                </ul>
            </div>

            <button id="eimzoLoginBtn" class="eimzo-btn">
                <i class="bi bi-key-fill me-2"></i>
                E-IMZO bilan kirish
            </button>

            <div id="eimzoStatus" class="status-box">
                <span class="text-muted">Tayyor</span>
            </div>

            <div class="text-center mt-4">
                <a href="{% url 'login' %}" class="text-decoration-none">
                    <i class="bi bi-arrow-left"></i> Oddiy kirish
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://127.0.0.1:64646/plugin/e-imzo-client.js"></script>
    <script>
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return "";
        }

        const statusBox = document.getElementById('eimzoStatus');
        const loginBtn = document.getElementById('eimzoLoginBtn');

        function setStatus(message, type = 'info') {
            statusBox.className = 'status-box ' + type;
            statusBox.innerHTML = message;
        }

        function setLoading(message) {
            setStatus(`<span class="spinner-border spinner-border-sm me-2"></span>${message}`, 'loading');
            loginBtn.disabled = true;
        }

        function setError(message) {
            setStatus(`<i class="bi bi-exclamation-circle me-2"></i>${message}`, 'error');
            loginBtn.disabled = false;
        }

        function setSuccess(message) {
            setStatus(`<i class="bi bi-check-circle me-2"></i>${message}`, 'success');
        }

        async function getChallenge() {
            const res = await fetch("{% url 'eimzo_auth:eimzo_challenge' %}", {
                credentials: 'same-origin',
                headers: { "X-CSRFToken": getCookie("csrftoken") }
            });
            if (!res.ok) throw new Error("Challenge olishda xatolik");
            return res.json();
        }

        async function verifySignature(signature, cert, chain) {
            const res = await fetch("{% url 'eimzo_auth:eimzo_verify' %}", {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie("csrftoken")
                },
                body: JSON.stringify({ signature, cert, chain })
            });
            return res.json();
        }

        async function signWithEimzo(nonce) {
            // E-IMZO Web Plugin bilan ishlash
            if (typeof CAPIWS === 'undefined') {
                throw new Error("E-IMZO Web Plugin topilmadi. Iltimos, pluginni o'rnating.");
            }

            // Kalitlarni yuklash
            setLoading("Kalitlar yuklanmoqda...");
            const keys = await CAPIWS.apikey();

            if (!keys || keys.length === 0) {
                throw new Error("Kalit topilmadi. Iltimos, E-IMZO kalitingizni ulang.");
            }

            // Birinchi kalitni tanlash (yoki foydalanuvchiga tanlash imkonini berish)
            const key = keys[0];

            setLoading("Imzolanmoqda...");

            // Nonce'ni imzolash
            const signedData = await CAPIWS.createPkcs7(
                key.disk,
                nonce,
                key.path,
                key.name,
                key.alias
            );

            if (!signedData || !signedData.pkcs7_64) {
                throw new Error("Imzolashda xatolik");
            }

            return {
                signature: signedData.pkcs7_64,
                cert: key.cert,
                chain: signedData.chain || []
            };
        }

        loginBtn.addEventListener("click", async () => {
            try {
                setLoading("Nonce olinmoqda...");
                const { nonce } = await getChallenge();

                const { signature, cert, chain } = await signWithEimzo(nonce);

                setLoading("Tekshirilmoqda...");
                const result = await verifySignature(signature, cert, chain);

                if (result.ok) {
                    setSuccess("Muvaffaqiyatli! Yo'naltirilmoqda...");
                    setTimeout(() => {
                        window.location.href = result.redirect || "/";
                    }, 1000);
                } else {
                    setError(result.error || "Autentifikatsiya xatosi");
                }
            } catch (err) {
                console.error(err);
                setError(err.message || "Xatolik yuz berdi");
            }
        });

        // Plugin mavjudligini tekshirish
        window.addEventListener('load', () => {
            setTimeout(() => {
                if (typeof CAPIWS === 'undefined') {
                    setError("E-IMZO Web Plugin topilmadi");
                }
            }, 2000);
        });
    </script>
</body>

</html>
