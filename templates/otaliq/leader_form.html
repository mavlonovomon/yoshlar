{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-lg p-4" style="border-radius: 20px;">
                <h3 class="fw-bold mb-4 text-center">Mas'ul rahbar ma'lumotlari</h3>
                <form method="POST">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-12">
                            <label class="form-label fw-bold">F.I.Sh</label>
                            {{ form.full_name }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Tashkilot turi</label>
                            {{ form.organization_type }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Darajasi</label>
                            {{ form.level }}
                        </div>
                        <div class="col-md-12">
                            <label class="form-label fw-bold">Tashkilot nomi</label>
                            {{ form.organization_name }}
                        </div>
                        <div class="col-md-12">
                            <label class="form-label fw-bold">Lavozimi</label>
                            {{ form.position }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Telefon</label>
                            {{ form.phone_number }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Soha</label>
                            {{ form.sector }}
                        </div>
                    </div>
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary py-3 fw-bold rounded-pill">Saqlash</button>
                        <a href="{% url 'otaliq:leader_list' %}" class="btn btn-light py-3 fw-bold rounded-pill">Bekor
                            qilish</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
